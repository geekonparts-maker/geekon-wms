<title>GeekOn WMS Αποθήκη</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* [AD] 16/11/2026: διαχειριστικό WMS - 3D αποθήκη (Όροφος -> Διάδρομος -> Dexion -> Ράφι -> Θέση). Πρωτότυπο v4:
   ρεαλιστικό 3D (σκιές, γαλβανιζέ Dexion, χαρτόκουτα), σχήμα ορόφου με τοίχους, κάτοψη-εικόνα από κάτω για αντιγραφή.
   Layout: 3D σκηνή αριστερά (πάνω σε κινητό), πάνελ ελέγχου δεξιά (κάτω σε κινητό). Χρώματα = εφαρμογή PDA. */
:root{
  --or:#ED872D; --or-d:#C96F1E; --or-t:#FDF1E6;
  --fg:#17191E; --bg:#F7F5F2; --card:#FFFFFF; --sec:#6B7280; --mut:#9AA0AB; --bd:#E2E5EA;
  --er:#C03D3D; --er-t:#FDECEC; --ok:#17803F; --ok-t:#E6F7EE;
  --scene:#E9ECF0; --floor:#D9DCDF; --wall:#F4F5F7; --steel:#A9B2BC; --shelf:#C9CFD6;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:Commissioner,system-ui,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --or:#F29544; --or-d:#F6AE6A; --or-t:#3A2A1C;
  --fg:#ECEEF2; --bg:#121418; --card:#1B1E24; --sec:#A3AAB6; --mut:#7D8593; --bd:#2C313A;
  --er:#F07A7A; --er-t:#3A1F22; --ok:#5CCB8A; --ok-t:#1B3326;
  --scene:#14171C; --floor:#3A3F46; --wall:#C9CED6; --steel:#9AA3AE; --shelf:#B5BCC5; color-scheme:dark}}
:root[data-theme="dark"]{
  --or:#F29544; --or-d:#F6AE6A; --or-t:#3A2A1C;
  --fg:#ECEEF2; --bg:#121418; --card:#1B1E24; --sec:#A3AAB6; --mut:#7D8593; --bd:#2C313A;
  --er:#F07A7A; --er-t:#3A1F22; --ok:#5CCB8A; --ok-t:#1B3326;
  --scene:#14171C; --floor:#3A3F46; --wall:#C9CED6; --steel:#9AA3AE; --shelf:#B5BCC5; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:minmax(0,1fr) 370px;height:100%}
.stage{position:relative;min-width:0;background:var(--scene)}
#cv{display:block;width:100%;height:100%;touch-action:none}
.panel{border-left:1px solid var(--bd);background:var(--card);overflow-y:auto;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
@media (max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:58vh auto;height:auto}.stage{height:58vh}.panel{border-left:0;border-top:1px solid var(--bd);overflow:visible}}
.brand{display:flex;align-items:center;gap:10px}
.brand b{background:var(--or);color:#fff;border-radius:10px;padding:6px 9px;font-weight:800;letter-spacing:.04em;font-size:12px}
.brand h1{font-size:18px;margin:0;font-weight:800;text-wrap:balance}
.note{font-size:12px;color:var(--sec);background:var(--or-t);border-radius:10px;padding:8px 10px;line-height:1.45}
.sec{display:flex;flex-direction:column;gap:8px}
.sec>h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:0;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px}
.chip.on{background:var(--or);border-color:var(--or);color:#fff}
.chip small{font-weight:500;opacity:.75;margin-left:4px}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--or);border-color:var(--or);color:#fff}
.btn.dng{color:var(--er);border-color:var(--er)}
.btn.dng.arm{background:var(--er);color:#fff}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--sec);font-weight:600;min-width:0}
label.f input,label.f select{border:1px solid var(--bd);background:var(--bg);border-radius:8px;padding:7px 8px;font-size:14px;width:100%;min-width:0}
label.f input[type=range]{padding:0}
.code{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.02em;overflow-wrap:anywhere}
.crumb{display:inline-block;background:var(--or-t);color:var(--or-d);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.box{border:1px solid var(--bd);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.shelves{display:flex;flex-direction:column-reverse;gap:6px}
.shelf{display:grid;grid-template-columns:44px 1fr 70px;gap:8px;align-items:center;font-size:13px}
.shelf .r{font-family:var(--mono);font-weight:700;color:var(--sec)}
.shelf .bar{height:10px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--shelf) 0 calc(var(--w) - 2px),transparent calc(var(--w) - 2px) var(--w))}
.shelf input{border:1px solid var(--bd);background:var(--bg);border-radius:8px;padding:5px 6px;width:100%;text-align:right;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stats div{border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center}
.stats b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--sec)}
.tool{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:12px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.tool>*{pointer-events:auto}
.tool .btn{box-shadow:0 2px 10px rgba(0,0,0,.10);backdrop-filter:blur(6px)}
.tool .btn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.search{display:flex;gap:6px;flex:1 1 220px;max-width:340px}
.search input{flex:1;min-width:0;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 10px;font-family:var(--mono);text-transform:uppercase}
.hint{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--sec);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;max-width:calc(100% - 24px)}
.list{font-family:var(--mono);font-size:12px;max-height:240px;overflow:auto;border:1px solid var(--bd);border-radius:10px;padding:8px;white-space:pre;background:var(--bg)}
.err{color:var(--er);font-size:12px;font-weight:600}
.ok{color:var(--ok);font-size:12px;font-weight:600}
.small{font-size:12px;color:var(--sec);line-height:1.45}
textarea{width:100%;min-height:120px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);font-family:var(--mono);font-size:12px;padding:8px}
input[type=file]{font-size:12px;max-width:100%}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app">
  <div class="stage">
    <canvas id="cv" aria-label="3D αποθήκη"></canvas>
    <div class="tool">
      <button class="btn on" id="v3d">3D</button>
      <button class="btn" id="vtop">Κάτοψη</button>
      <button class="btn" id="vmove" title="Σύρε ένα Dexion πάνω στο πάτωμα">Μετακίνηση</button>
      <button class="btn" id="vadd" title="Κλικ στο πάτωμα για να μπει Dexion">+ Dexion</button>
      <button class="btn" id="vshape" title="Σύρε τις γωνίες του ορόφου">Σχήμα</button>
      <button class="btn" id="vrot" hidden title="Γύρνα 90° (πλήκτρο R)">⟳ Γύρνα</button>
      <form class="search" id="sform"><input id="sq" placeholder="IS-A02-D03-R01-P12" autocomplete="off" spellcheck="false"><button class="btn" type="submit">Βρες</button></form>
    </div>
    <div class="hint" id="hint"></div>
  </div>
  <aside class="panel" id="panel"></aside>
</div>

      <div class="small">Ανοίγει η κάτοψη και η σειρά ακολουθεί το ποντίκι. Πάτα εκεί που θες να ξεκινά. Κοντά σε τοίχο κουμπώνει μόνη της με την πλάτη στον τοίχο. R ή ⟳ για γύρισμα.</div></div>`;
  }
  h += `</div>`;
  h += `<div class="sec"><h2>Θέσεις και αρχείο</h2><div class="row"><button class="btn" data-list="1">${S.list ? "Κλείσε λίστα" : "Λίστα κωδικών θέσεων"}</button><button class="btn" data-json="1">${S.json ? "Κλείσε" : "Εξαγωγή / εισαγωγή"}</button><button class="btn dng ${S.reset ? "arm" : ""}" data-reset="1">${S.reset ? "Σίγουρα; Πάτα ξανά" : "Άδειασμα"}</button></div>`;
  if (S.list) {
    const codes = []; rs.slice().sort((a, b) => a.floor.localeCompare(b.floor) || a.aisle - b.aisle || a.num - b.num).forEach(r => r.shelves.forEach((s, i) => { for (let p = 1; p <= s; p++) codes.push(binCode(r, i + 1, p)); }));
    h += `<div class="list" id="codes">${codes.join("\n")}</div><div class="row"><button class="btn" data-copylist="1">Αντιγραφή (${codes.length})</button></div>`;
  }
  if (S.json) h += `<textarea id="json" spellcheck="false">${esc(JSON.stringify({ floors: L.floors.map(({ img, ...x }) => x), racks: L.racks.map(({ id, ...r }) => r) }, null, 1))}</textarea><div class="small">Οι εικόνες κάτοψης δεν μπαίνουν στην εξαγωγή (είναι μεγάλες).</div><div class="row"><button class="btn" data-import="1">Φόρτωσε αυτό</button></div>`;
  if (S.msg) h += `<div class="${S.msgErr ? "err" : "ok"}">${esc(S.msg)}</div>`;
  h += `</div>`;
  P.innerHTML = h;
  const fi = document.getElementById("fimg"); if (fi) fi.onchange = loadImg;
}
function setMsg(m, err) { S.msg = m; S.msgErr = !!err; renderPanel(); setTimeout(() => { if (S.msg === m) { S.msg = ""; renderPanel(); } }, 4000); }
async function copy(t) { try { await navigator.clipboard.writeText(t); setMsg("Αντιγράφηκε"); } catch (e) { setMsg("Δεν επιτράπηκε η αντιγραφή. Επίλεξε το κείμενο και πάτα Ctrl+C.", true); } }
function changed(rebuild) { L.example = false; save(); if (rebuild) build(); renderPanel(); }
function loadImg(e) {
  const file = e.target.files && e.target.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => { const im = new Image(); im.onload = () => {
    const k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
    const f = fl(S.floor); f.img = c.toDataURL("image/jpeg", 0.8); f.imgOp = 0.55; f.d = +(f.w * c.height / c.width).toFixed(2);
    if (f.poly.length === 4) f.poly = [[0, 0], [f.w, 0], [f.w, f.d], [0, f.d]];
    changed(true); frame(); setMsg("Μπήκε η κάτοψη. Όρισε τώρα το σωστό πλάτος σε μέτρα.");
  }; im.src = rd.result; };
  rd.readAsDataURL(file);
}

P.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; const d = b.dataset;
  if (d.floor) { S.floor = d.floor; S.all = false; S.rack = S.bin = null; S.vtx = -1; frame(); renderPanel(); }
  else if (d.all) { S.all = true; S.rack = S.bin = null; if (S.mode === "shape") setMode(""); frame(); renderPanel(); }
  else if (d.addfloor) { let i = 1, c; do { c = "F" + i++; } while (fl(c)); L.floors.push({ code: c, name: "Νέος όροφος", w: 10, d: 8, lvl: Math.max(...L.floors.map(lvlOf)) + 1, poly: [[0, 0], [10, 0], [10, 8], [0, 8]], walls: [] }); S.floor = c; S.all = false; changed(false); frame(); }
  else if (d.copy) copy(d.copy);
  else if (d.noimg) { const f = fl(S.floor); delete f.img; changed(true); }
  else if (d.shape) setMode(S.mode === "shape" ? "" : "shape");
  else if (d.rect) { const f = fl(S.floor); f.poly = [[0, 0], [f.w, 0], [f.w, f.d], [0, f.d]]; f.walls = []; S.vtx = -1; changed(true); }
  else if (d.delvtx) { const f = fl(S.floor); if (f.poly.length > 3) { f.poly.splice(S.vtx, 1); S.vtx = -1; fitPolyBounds(); changed(true); } }
  else if (d.shelf) { const r = L.racks.find(x => x.id === S.rack); if (+d.shelf > 0) r.shelves.push(r.shelves[r.shelves.length - 1] || 10); else if (r.shelves.length > 1) r.shelves.pop(); S.bin = null; changed(true); }
  else if (d.allslots) { const v = +document.getElementById("allslots").value; if (v >= 1 && v <= 60) { const r = L.racks.find(x => x.id === S.rack); r.shelves = r.shelves.map(() => v); S.bin = null; changed(true); } }
  else if (d.turn) turnGhostOrRack();
  else if (d.nudge) { const [a, b] = d.nudge.split(",").map(Number); nudge(a * 0.05, b * 0.05); }
  else if (d.dup) { const r = L.racks.find(x => x.id === S.rack); const nums = L.racks.filter(x => x.floor === r.floor && x.aisle === r.aisle).map(x => x.num); const a = (r.rot || 0) * Math.PI / 180, step = r.w / 100; const n = { ...r, id: uid(), num: Math.max(...nums) + 1, shelves: r.shelves.slice(), x: +(r.x + Math.cos(a) * step).toFixed(2), z: +(r.z - Math.sin(a) * step).toFixed(2) }; L.racks.push(n); S.rack = n.id; S.bin = null; changed(true); }
  else if (d.del) { if (!S.del) { S.del = true; renderPanel(); } else { L.racks = L.racks.filter(x => x.id !== S.rack); S.rack = S.bin = null; S.del = false; changed(true); } }
  else if (d.gen) { S.gen = !S.gen; renderPanel(); }
  else if (d.gengo) {
    const v = id => document.getElementById(id).value;
    const floor = v("g_floor"), aisle = +v("g_aisle"), n = +v("g_n"), sh = +v("g_sh"), sl = +v("g_sl"), rot = +v("g_rot"), w = +v("g_w"), dd = +v("g_d"), hh = +v("g_h");
    if (!(aisle >= 1 && n >= 1 && n <= 60 && sh >= 1 && sl >= 1 && w > 0 && dd > 0 && hh > 0)) return setMsg("Έλεγξε τα νούμερα: όλα πρέπει να είναι πάνω από 0.", true);
    // [AD] 16/11: δεν μπαίνουν πια σε τυχαίο σημείο: η σειρά ακολουθεί το ποντίκι και μπαίνει με κλικ εκεί που θέλεις
    S.floor = floor; S.all = false; S.gen = false; S.rack = S.bin = null;
    setTop(true); setMode("place", { n, aisle, rot, w, d: dd, h: hh, shelves: Array(sh).fill(sl) });
  }
  else if (d.list) { S.list = !S.list; renderPanel(); }
  else if (d.copylist) copy(document.getElementById("codes").textContent);
  else if (d.json) { S.json = !S.json; renderPanel(); }
  else if (d.import) {
    try { const j = JSON.parse(document.getElementById("json").value); if (!Array.isArray(j.floors) || !Array.isArray(j.racks) || !j.floors.length) throw 0;
      const imgs = {}; L.floors.forEach(x => { if (x.img) imgs[x.code] = x.img; });
      L = { floors: j.floors.map(x => ({ ...x, img: imgs[x.code], poly: x.poly || [[0, 0], [x.w, 0], [x.w, x.d], [0, x.d]], walls: x.walls || [] })), racks: j.racks.map(r => ({ ...r, id: uid() })) };
      S.floor = L.floors[0].code; S.rack = S.bin = null; S.json = false; changed(false); frame(); setMsg("Φορτώθηκε.");
    } catch (e) { setMsg("Δεν είναι σωστό αρχείο αποθήκης.", true); }
  }
  else if (d.reset) { if (!S.reset) { S.reset = true; renderPanel(); } else { L = example(); L.racks = []; L.example = false; S.floor = "IS"; S.all = false; S.rack = S.bin = null; S.reset = false; save(); frame(); renderPanel(); setMsg("Άδειασαν τα Dexion. Οι όροφοι και η κάτοψη έμειναν."); } }
});
P.addEventListener("change", e => {
  const t = e.target, f = fl(S.floor);
  if (t.id === "fimg") return;
  if (t.id === "grp") { S.grp = t.checked; return; }
  if (t.id === "fcode" && f) { const c = t.value.trim().toUpperCase(); if (!/^[A-Z0-9]{1,3}$/.test(c) || (c !== f.code && fl(c))) return setMsg("Ο κωδικός ορόφου θέλει 1-3 λατινικά γράμματα ή ψηφία και να μην υπάρχει ήδη.", true); L.racks.forEach(r => { if (r.floor === f.code) r.floor = c; }); f.code = c; S.floor = c; return changed(true); }
  if (t.id === "fname" && f) { f.name = t.value.trim() || f.code; return changed(true); }
  if (t.id === "flvl" && f) { f.lvl = Math.round(+t.value || 0); return changed(true); }
  if (t.id === "fop" && f) { f.imgOp = +t.value; return changed(true); }
  if ((t.id === "fw" || t.id === "fd") && f) {
    const v = +t.value; if (!(v >= 2)) return;
    if (t.id === "fw" && f.img) {   // [AD] κλίμακα: με εικόνα, όλα (σχήμα, Dexion) μεγαλώνουν/μικραίνουν μαζί
      const k = v / f.w; f.poly = f.poly.map(([x, z]) => [+(x * k).toFixed(2), +(z * k).toFixed(2)]); f.walls = f.walls.map(w => w.map(n => +(n * k).toFixed(2)));
      L.racks.filter(r => r.floor === f.code).forEach(r => { r.x = +(r.x * k).toFixed(2); r.z = +(r.z * k).toFixed(2); });
      f.d = +(f.d * k).toFixed(2); f.w = v;
    } else { const old = f[t.id === "fw" ? "w" : "d"]; f[t.id === "fw" ? "w" : "d"] = v; if (f.poly.length === 4 && f.poly[2][0] === (t.id === "fw" ? old : f.w) ) f.poly = [[0, 0], [f.w, 0], [f.w, f.d], [0, f.d]]; }
    changed(false); frame(); return;
  }
  const r = L.racks.find(x => x.id === S.rack); if (!r) return;
  if (t.dataset.r) { const k = t.dataset.r; r[k] = k === "floor" ? t.value : +t.value; if (k === "floor") { S.floor = t.value; S.all = false; } S.bin = null; changed(false); return k === "floor" ? frame() : build(); }
  if (t.dataset.slots != null) { const v = Math.max(1, Math.min(60, Math.round(+t.value || 1))); r.shelves[+t.dataset.slots] = v; S.bin = null; return changed(true); }
});

// ================================================================ εργαλεία πάνω από το 3D
const tb = id => document.getElementById(id);
const HINTS = { "": "Κλικ σε Dexion = επιλογή · σύρε το επιλεγμένο για να το πας όπου θες · κλικ σε κουτί = κωδικός θέσης · ροδέλα ζουμ",
  move: "Μετακίνηση: σύρε όποιο Dexion θες (κουμπώνει σε τοίχο και δίπλα σε άλλο Dexion)",
  add: "+ Dexion: πάτα στο πάτωμα όπου θες να μπει · R ή ⟳ γύρισμα · Esc τέλος",
  place: "Πάτα στο πάτωμα εκεί που θες να ξεκινά η σειρά · R ή ⟳ γύρισμα · Esc άκυρο",
  shape: "Σχήμα: σύρε τις πορτοκαλί γωνίες των τοίχων · γκρι τελεία = νέα γωνία" };
function setMode(m, spec) {
  const wasAll = S.all;
  if (m && m !== "move") S.all = false;
  S.mode = m; S.vtx = -1; ghost.visible = false;
  S.place = m === "place" ? spec : null;
  S.addSpec = m === "add" ? newSpec() : null;
  ["vmove", "vadd", "vshape"].forEach(id => tb(id).classList.remove("on"));
  if (m && m !== "place") tb({ move: "vmove", add: "vadd", shape: "vshape" }[m]).classList.add("on");
  tb("vrot").hidden = !(m === "add" || m === "place");
  tb("hint").textContent = HINTS[m];
  if (wasAll && !S.all) frame(); else build();
  renderPanel();
}
function setTop(v) { S.top = v; tb("vtop").classList.toggle("on", v); tb("v3d").classList.toggle("on", !v); frame(); }
tb("v3d").onclick = () => setTop(false);
tb("vtop").onclick = () => setTop(true);
tb("vrot").onclick = () => turnGhostOrRack();
tb("vmove").onclick = () => setMode(S.mode === "move" ? "" : "move");
tb("vadd").onclick = () => { if (S.mode !== "add" && !S.top) setTop(true); setMode(S.mode === "add" ? "" : "add"); };
tb("vshape").onclick = () => setMode(S.mode === "shape" ? "" : "shape");
tb("sform").onsubmit = e => {
  e.preventDefault();
  const q = tb("sq").value.trim().toUpperCase().replace(/\s+/g, "");
  const m = q.match(/^([A-Z0-9]{1,3})-A(\d+)-D(\d+)(?:-R(\d+)(?:-P(\d+))?)?$/);
  if (!m) return setMsg("Γράψε κωδικό σαν IS-A02-D03-R01-P12 (ή μέχρι το Dexion: IS-A02-D03).", true);
  const r = L.racks.find(x => x.floor === m[1] && x.aisle === +m[2] && x.num === +m[3]);
  if (!r) return setMsg(`Δεν υπάρχει το Dexion ${m[1]}-A${pad(+m[2])}-D${pad(+m[3])}.`, true);
  const s = m[4] ? +m[4] : 0, p = m[5] ? +m[5] : 0;
  if (s && (s > r.shelves.length || (p && p > r.shelves[s - 1]))) return setMsg("Το Dexion υπάρχει, αλλά δεν έχει τέτοιο ράφι ή θέση.", true);
  S.floor = r.floor; S.all = false; S.rack = r.id; S.bin = s && p ? { rack: r.id, s, p } : null;
  S.top = false; tb("v3d").classList.add("on"); tb("vtop").classList.remove("on"); cam = camP; setupCtl(camP);
  build(); renderPanel();
  const a = (r.rot || 0) * Math.PI / 180, ty = s ? 0.06 + (s - 0.5) * ((r.h / 100 - 0.08) / r.shelves.length) : r.h / 200;
  ctl.target.set(r.x, ty, r.z); camP.position.set(r.x + Math.sin(a) * 2.4 + 0.4, ty + 0.9, r.z + Math.cos(a) * 2.4); ctl.update();   // [AD] μπροστά από το Dexion
};

tb("hint").textContent = HINTS[""];
renderPanel(); resize(); frame();
</script>
